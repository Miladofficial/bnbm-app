
name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Send APK to Telegram on Success
        if: success()
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          curl -F chat_id="281420084"                -F document=@"${APK_PATH}"                -F caption="🚀 **اپلیکیشن BNBM با موفقیت کامپایل شد!**"                "https://api.telegram.org/bot8931006843:AAHdpIvut_-PgkoIHog_bZRiF3YhrUEEqO4/sendDocument"

      - name: Send Error & Auto-Fix Button to Telegram on Failure
        if: failure()
        run: |
          JSON_PAYLOAD=$(jq -n             --arg chat_id "281420084"             --arg text "❌ **خطای کامپایل در پروژه BNBM!**\n\nپروژه با مشکل مواجه شد. می‌توانید با کلیک روی دکمه زیر، دستور اصلاح خودکار کد را صادر کنید:"             --arg repo "bnbm-app"             '{
              chat_id: $chat_id,
              text: $text,
              parse_mode: "Markdown",
              reply_markup: {
                inline_keyboard: [[
                  { text: "🛠 رفع خودکار باگ و بیلد مجدد", callback_data: ("autofix_" + $repo) }
                ]]
              }
            }')

          curl -s -X POST "https://api.telegram.org/bot8931006843:AAHdpIvut_-PgkoIHog_bZRiF3YhrUEEqO4/sendMessage"                -H "Content-Type: application/json"                -d "$JSON_PAYLOAD"
